name: Check editorial privacy
on:
  push:
    paths: ['backend/**', 'scripts/sync-publications.mjs']
  pull_request:
    paths: ['backend/**', 'scripts/sync-publications.mjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix backend ci --no-fund --no-audit
      - run: npm --prefix backend test
