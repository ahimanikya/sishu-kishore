name: Check editorial privacy
on:
  push:
    paths: ['backend/**', 'scripts/**', 'tests/**', '.github/workflows/backend-check.yml']
  pull_request:
    paths: ['backend/**', 'scripts/**', 'tests/**', '.github/workflows/backend-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix backend ci --no-fund --no-audit
      - run: npm --prefix backend test
