ption value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option></select> / 56</label><a href="/shishu/books/dakuchhi_gaon/page-4.html" id="book-next">ଆଗକୁ →</a></nav><p class="book-hint">← → <span lang="en">Use the arrows to turn pages</span></p><noscript><p>ପୃଷ୍ଠା ବଦଳାଇବାକୁ ଉପର ଲିଙ୍କ ବ୍ୟବହାର କରନ୍ତୁ।</p><div class="book-text prose"><p>ଗ୍ରୀଷ୍ମ ଛୁଟି ହୋଇଥାଏ...</p><p>ପୁରୀ ସହରରେ ରହି ପାଠପଢୁଛି ଶ୍ରୀବାସ୍ତବ । ତାଙ୍କ ନିଜଘର ପୁରୀ ସହରରେ । ଶ୍ରୀକ୍ଷେତ୍ରରେ ରହିଆସୁଛନ୍ତି ବୋଲି ଶ୍ରୀବାସ୍ତବର ବାପାଙ୍କ ମନ ଭାରି ଖୁସିଥାଏ । ଅନ୍ୟମାନଙ୍କ ଆଗରେ ଖୁସିରେ କହନ୍ତି, “ପୁଣ୍ୟ କରିଛୁ ବୋଲି ଶ୍ରୀଜଗନ୍ନାଥ ଆମ ଉପରେ ଦୟା ରଖିଛନ୍ତି । ତାଙ୍କ ନିକଟରେ ମୁଣ୍ଡ ଗୁଞ୍ଜିବାକୁ ସ୍ଥାନ ଖଣ୍ଡେ ପାଇଛୁ । ଏହାଠୁ ବଳି ବଡ଼ ଭାଗ୍ୟ କ’ଣ ଥାଇପାରେ !”</p><p>ଏକଥା ସତ୍ୟ ଯେ, ଶ୍ରୀବାସ୍ତବକୁ ମଧ୍ୟ ଖୁସି ଲାଗେ, ସେ ଶ୍ରୀକ୍ଷେତ୍ରରେ ରହିଛି ବୋଲି । ପ୍ରତିଦିନ ଟ୍ୟୁସନ୍‌କୁ ପାଠ ପଢ଼ିବାକୁ ଗଲାବେଳେ ମନ୍ଦିର ଭିତରକୁ ଯିବା ପାଇଁ ସିନା ସମୟ ନ ଥାଏ, ମାତ୍ର ସବୁବେଳେ ପତିତପାବନଙ୍କୁ ଦର୍ଶନ କରି ଯାଏ । ଶ୍ରୀଜଗନ୍ନାଥଙ୍କ ପ୍ରତି ଶ୍ରୀବାସ୍ତବର ଭକ୍ତିଭାବ ଯେପରି ଠୁଳ ହୋଇ ରହିଛି । ବାସ୍ତବରେ ପୁରୀ ସହରର ଖ୍ୟାତି ବିଶ୍ୱବିଦିତ, ଜଗତର ନାଥ ଶ୍ରୀଜଗନ୍ନାଥଙ୍କ ପାଇଁ । କିନ୍ତୁ ଅନେକ ସମୟରେ ତା’ର ଅଜାଘର ଗାଁକୁ ଯିବାକୁ ଇଚ୍ଛା ହୁଏ । ତାଙ୍କ ନିଜଗାଁ ପୁରୀ ସହର ପାଖାପାଖି ହୋଇଥିଲେ ବି ଗାଁ ସହିତ ବିଶେଷ ସମ୍ପର୍କ ନାହିଁ କହିଲେ ଚଳେ ।</p><p>ଶ୍ରୀବାସ୍ତବର ଅଜାଘର ଗାଁ ସାକ୍ଷୀଗୋପାଳ ଠାରୁ କିଛି ଦୂରରେ । ଜୀଅପୁର । ତାଙ୍କ ଗାଁକୁ ଯିବାକୁ ହେଲେ ସାକ୍ଷୀଗୋପାଳ ଦେଇ ଯିବାକୁ ହୁଏ । କଥା ପ୍ରସଙ୍ଗରେ ତା’ର ଅଜା ତାଙ୍କ ଗାଁକୁ ଭୁରିଭୁରି ପ୍ରଶଂସା କରିବା କଥା ସେ ବହୁବାର ଶୁଣିଛି । ସେ ଯେତେଥର ସେଇ ଗାଁକୁ ଯାଇଛି, ସେ ସେତିକି ଆନନ୍ଦ ଅନୁଭବ କରିଛି । ଅଜାଙ୍କ କଥାକୁ ସେ ମନେ ମନେ</p></div></noscript></main><script defer src="/page-sounds.js?v=1"></script><script defer="" src="/book-reader.js?v=playful-sound-v1"></script><script defer="" src="/share.js?v=responses-v1"></script><script defer="" src="/services.js?v=firebase-v1"></script></body></html>
